# ==============================================================================
# Prometheus Configuration for Messaging Platform Ecosystem
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'messaging-backend'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['messaging-backend:8083']

  - job_name: 'messaging-dispatcher'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['messaging-dispatcher:8081']
