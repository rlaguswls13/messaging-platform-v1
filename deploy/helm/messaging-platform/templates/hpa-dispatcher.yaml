{{- if .Values.autoscaling.dispatcher.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "messaging-platform.fullname" . }}-dispatcher
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "dispatcher") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "messaging-platform.fullname" . }}-dispatcher
  minReplicas: {{ .Values.autoscaling.dispatcher.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.dispatcher.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.dispatcher.targetCPUUtilizationPercentage }}
{{- end }}
