apiVersion: v1
kind: Secret
metadata:
  name: {{ include "messaging-platform.fullname" . }}-secret
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "secret") | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.infrastructure.mariadb.password | b64enc | quote }}
  ACTIVEMQ_PASSWORD: {{ .Values.infrastructure.activemq.password | b64enc | quote }}
  MASTER_KEY: {{ .Values.security.masterKey | b64enc | quote }}
  JWT_SECRET: {{ .Values.security.jwtSecret | b64enc | quote }}
