{{- if .Values.services.dispatcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messaging-platform.fullname" . }}-dispatcher
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "dispatcher") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.dispatcher.enabled }}
  replicas: {{ .Values.services.dispatcher.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "dispatcher") | nindent 8 }}
    spec:
      containers:
        - name: dispatcher
          image: "{{ if .Values.global.image.registry }}{{ .Values.global.image.registry }}/{{ end }}{{ .Values.services.dispatcher.image.repository }}:{{ default .Values.global.image.tag .Values.services.dispatcher.image.tag }}"
          imagePullPolicy: {{ default .Values.global.image.pullPolicy .Values.services.dispatcher.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.dispatcher.service.httpPort }}
              protocol: TCP
            - name: netty-tcp
              containerPort: {{ .Values.services.dispatcher.service.tcpPort }}
              protocol: TCP
          env:
            - name: DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DEV_MODE
            - name: APP_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: APP_DEV_MODE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_PROFILES_ACTIVE
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: TZ
            - name: DISPATCHER_MOM_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DISPATCHER_MOM_TYPE
            - name: SPRING_ACTIVEMQ_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_ACTIVEMQ_BROKER_URL
            - name: DISPATCHER_MOM_ACTIVEMQ_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DISPATCHER_MOM_ACTIVEMQ_BROKER_URL
            - name: SPRING_ACTIVEMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: ACTIVEMQ_USER
            - name: SPRING_ACTIVEMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: ACTIVEMQ_PASSWORD
            - name: LOGGER_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: LOGGER_HOST
            - name: LOGGER_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: LOGGER_PORT
            - name: SECURITY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: MASTER_KEY
          {{- if .Values.services.dispatcher.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.services.dispatcher.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.services.dispatcher.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.services.dispatcher.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.dispatcher.resources | nindent 12 }}
{{- end }}
