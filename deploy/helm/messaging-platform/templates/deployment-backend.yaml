{{- if .Values.services.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messaging-platform.fullname" . }}-backend
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "backend") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ .Values.services.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "backend") | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ if .Values.global.image.registry }}{{ .Values.global.image.registry }}/{{ end }}{{ .Values.services.backend.image.repository }}:{{ default .Values.global.image.tag .Values.services.backend.image.tag }}"
          imagePullPolicy: {{ default .Values.global.image.pullPolicy .Values.services.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.backend.service.port }}
              protocol: TCP
          env:
            - name: DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DEV_MODE
            - name: APP_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: APP_DEV_MODE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_PROFILES_ACTIVE
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: TZ
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: APP_TARGETING_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: APP_TARGETING_BASE_URL
            - name: APP_PAYLOADER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: APP_PAYLOADER_BASE_URL
            - name: DISPATCHER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DISPATCHER_BASE_URL
            - name: FAILOVER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: FAILOVER_BASE_URL
            - name: SECURITY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: MASTER_KEY
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: JWT_SECRET
          {{- if .Values.services.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.services.backend.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.services.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.services.backend.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.backend.resources | nindent 12 }}
{{- end }}
