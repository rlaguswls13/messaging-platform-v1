{{- if .Values.services.failover.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messaging-platform.fullname" . }}-failover
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "failover") | nindent 4 }}
spec:
  replicas: {{ .Values.services.failover.replicaCount }}
  selector:
    matchLabels:
      {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "failover") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "failover") | nindent 8 }}
    spec:
      containers:
        - name: failover
          image: "{{ if .Values.global.image.registry }}{{ .Values.global.image.registry }}/{{ end }}{{ .Values.services.failover.image.repository }}:{{ default .Values.global.image.tag .Values.services.failover.image.tag }}"
          imagePullPolicy: {{ default .Values.global.image.pullPolicy .Values.services.failover.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.failover.service.port }}
              protocol: TCP
          env:
            - name: DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: DEV_MODE
            - name: APP_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: APP_DEV_MODE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_PROFILES_ACTIVE
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: TZ
            - name: FAILOVER_MOM_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: FAILOVER_MOM_TYPE
            - name: ACTIVEMQ_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: ACTIVEMQ_BROKER_URL
            - name: SPRING_ACTIVEMQ_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: SPRING_ACTIVEMQ_BROKER_URL
            - name: SPRING_ACTIVEMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-config
                  key: ACTIVEMQ_USER
            - name: SPRING_ACTIVEMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "messaging-platform.fullname" . }}-secret
                  key: ACTIVEMQ_PASSWORD
          {{- if .Values.services.failover.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.services.failover.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.services.failover.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.services.failover.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.failover.resources | nindent 12 }}
{{- end }}
