{{- if .Values.services.payloader.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messaging-platform.fullname" . }}-payloader
  labels:
    {{- include "messaging-platform.labels" (dict "context" . "service" "payloader") | nindent 4 }}
spec:
  type: {{ .Values.services.payloader.service.type }}
  ports:
    - port: {{ .Values.services.payloader.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "messaging-platform.selectorLabels" (dict "context" . "service" "payloader") | nindent 4 }}
{{- end }}
