# =================================================================
# [VM-1] Nginx Ingress Reverse Proxy & Load Balancer Configuration
# =================================================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # 대용량 엑셀/타겟팅 업로드 허용

    # GZIP 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # ─── Upstream 선언: VM-4 내부 백엔드 망 ───
    upstream backend_api {
        server portal-backend:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_portal {
        server portal-frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ─── HTTP (80) ───
    server {
        listen 80;
        server_name messaging.enterprise.internal localhost _;

        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 1. 단축 URL 리다이렉트 (/s/{shortCode}) ➔ 백엔드로 고속 전달
        location /s/ {
            proxy_pass http://backend_api/s/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 2. 포털 REST API (/api/) ➔ 백엔드 포털 코어로 라우팅
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path /api /;
            proxy_cookie_path /api/ /;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 3. 실시간 SSE 관제 스트림 (/api/v1/monitoring/live-stream) ➔ 버퍼링 차단
        location /api/v1/monitoring/live-stream {
            proxy_pass http://backend_api/api/v1/monitoring/live-stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s; # 24시간 장기 스트리밍 연결 유지
        }

        # 4. Next.js 16 웹 포털 프론트엔드 (/) ➔ 프론트엔드 컨테이너로 라우팅
        location / {
            proxy_pass http://frontend_portal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
