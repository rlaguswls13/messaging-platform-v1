# =================================================================
# [VM-1] 외부연결 영역 (External Ingress & Gateway Tier)
# Podman Compose 배포 매니페스트
# 호스트 IP 예시: 192.168.10.10
# =================================================================
version: '3.8'

services:
  nginx-ingress:
    image: docker.io/library/nginx:1.27-alpine
    container_name: ingress-gateway
    restart: always
    ports:
      - "8000:80"
      - "8443:443"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - platform-mesh

networks:
  platform-mesh:
    external: true
